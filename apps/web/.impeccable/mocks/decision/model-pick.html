<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--stock:#fbfbf9;--ink:#141414;--red:#c8202e;--back:#22305e;--line:#e6e6e2}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--stock);font-family:Onest,sans-serif;color:var(--ink);position:relative}
.bar{position:absolute;top:12px;left:16px;right:16px;display:flex;justify-content:space-between;align-items:center}
.idx{display:flex;gap:8px}
.idx div{width:54px;height:66px;border:1px solid var(--line);border-radius:9px;background:#fff;padding:6px 8px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.idx small{display:block;font-size:10px;font-weight:600;color:#777}
.idx b{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.seat{position:absolute;display:grid;justify-items:center;gap:4px}
.av{width:46px;height:46px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:800;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seat.turn .av{outline:2.5px solid var(--back);outline-offset:2px}
.nm{font-size:12px;font-weight:650}
.backs{display:flex;margin-top:-8px}
.backs i{width:24px;height:34px;border-radius:4px;background:var(--back);border:2px solid #fff;margin-left:-14px;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.backs i:first-child{margin:0}
.side .backs{flex-direction:column}.side .backs i{margin:-24px 0 0;width:34px;height:24px}.side .backs i:first-child{margin:0}
.bub{position:absolute;bottom:calc(100% + 8px);background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px 11px;font-size:13px;font-weight:700;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,.08)}
.board{position:absolute;left:50%;top:244px;transform:translateX(-50%);width:268px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px;box-shadow:0 8px 24px rgba(0,0,0,.08);display:grid;gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b{height:46px;border:1px solid var(--line);border-radius:9px;display:flex;align-items:center;padding:0 10px;gap:8px;font-weight:650;font-size:14px}
.b .s{font-size:20px}
.b.off{color:#c9c9c4}
.r{color:var(--red)}
.pass{height:46px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700}
.me{position:absolute;left:50%;bottom:182px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-weight:700;padding:4px 14px 4px 4px;border-radius:99px;background:#fff;border:1px solid var(--line)}
.me .av{width:34px;height:34px;box-shadow:none}
.hand{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex}
.c{width:80px;height:116px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-left:-22px;padding:6px 8px;font-weight:800;font-size:22px;line-height:1;box-shadow:0 2px 8px rgba(0,0,0,.08)}
.c:first-child{margin:0}.c span{display:block;font-size:18px}
</style></head><body>
<div class="bar"><div class="idx"><div><small>Ние</small><b>0</b></div><div><small>Вие</small><b>0</b></div></div><span style="font-size:22px">⋯</span></div>
<div class="seat" style="top:96px;left:50%;transform:translateX(-50%)"><span class="bub">Пас</span><div class="av">Б2</div><div class="nm">Бот 2</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side" style="top:340px;left:10px"><div class="av">Б3</div><div class="nm">Бот 3</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side turn" style="top:340px;right:10px"><span class="bub" style="right:0">♠ Пика</span><div class="av">Б1</div><div class="nm">Бот 1</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="board"><div class="grid">
<div class="b off"><span class="s">♣</span>Спатия</div><div class="b">Без коз</div>
<div class="b off"><span class="s">♦</span>Каро</div><div class="b">Всичко коз</div>
<div class="b off"><span class="s">♥</span>Купа</div><div class="b r">Контра</div>
<div class="b off"><span class="s">♠</span>Пика</div><div class="b off">Реконтра</div>
</div><div class="pass">Пас</div></div>
<div class="me"><div class="av">А</div>Ани</div>
<div class="hand"><div class="c">J<span>♣</span></div><div class="c r">J<span>♦</span></div><div class="c">K<span>♠</span></div><div class="c">A<span>♠</span></div><div class="c r">K<span>♥</span></div></div>
</body></html>
