<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--paper:#fff;--ink:#111;--form:#1f3fd1;--red:#d3222f;--rule:#c9d1f3;--soft:#f4f6fd}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--paper);font-family:Onest,sans-serif;color:var(--ink);position:relative}
.bar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;border-bottom:1px solid var(--rule)}
.score{display:flex;border:1.5px solid var(--form);border-radius:6px;overflow:hidden;font-variant-numeric:tabular-nums}
.score div{padding:5px 12px;display:flex;gap:8px;align-items:baseline;font-size:12px;color:var(--form);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.score div+div{border-left:1.5px solid var(--form)}
.score b{font-size:20px;color:var(--ink);letter-spacing:0}
.menu{font-size:22px;color:var(--ink)}
.seat{position:absolute;display:grid;justify-items:center;gap:4px}
.av{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:15px;background:#fff}
.seat.turn .av{background:var(--ink);color:#fff}
.nm{font-size:12px;font-weight:600}
.backs{display:flex}
.backs i{width:22px;height:32px;border:1.5px solid var(--form);border-radius:4px;margin-left:-12px;background:repeating-linear-gradient(45deg,#fff 0 3px,var(--soft) 3px 6px)}
.backs i:first-child{margin:0}
.side .backs{flex-direction:column}.side .backs i{margin:-22px 0 0;width:32px;height:22px}.side .backs i:first-child{margin:0}
.bub{position:absolute;bottom:calc(100% + 6px);white-space:nowrap;font-size:13px;font-weight:700;padding:4px 10px;border:1.5px solid var(--ink);border-radius:999px;background:#fff}
.arc{position:absolute;left:50%;top:50%;width:250px;height:250px;margin:-125px 0 0 -125px;border:1px dashed var(--rule);border-radius:50%}
.board{position:absolute;left:50%;top:248px;transform:translateX(-50%);width:262px;border:1.5px solid var(--form);border-radius:8px;background:#fff}
.board h6{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--form);padding:8px 10px;border-bottom:1px solid var(--rule);font-weight:700;display:flex;justify-content:space-between}
.grid{display:grid;grid-template-columns:1fr 1fr}
.cell{height:50px;border-bottom:1px solid var(--rule);display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;font-weight:600}
.cell:nth-child(odd){border-right:1px solid var(--rule)}
.box{width:18px;height:18px;border:1.5px solid var(--form);border-radius:3px;flex:none}
.cell.on .box{background:var(--ink);border-color:var(--ink)}
.cell.off{color:#b9bfd0}.cell.off .box{border-color:var(--rule)}
.r{color:var(--red)}
.pass{margin:10px;height:46px;border-radius:6px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:16px}
.me{position:absolute;left:50%;bottom:184px;transform:translateX(-50%);display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px}
.me .av{width:36px;height:36px;background:var(--ink);color:#fff}
.hand{position:absolute;bottom:26px;left:50%;transform:translateX(-50%);display:flex}
.c{width:78px;height:112px;border:1.5px solid var(--ink);border-radius:8px;background:#fff;margin-left:-22px;padding:6px 8px;font-weight:800;font-size:22px;line-height:1}
.c:first-child{margin:0}.c span{display:block;font-size:18px}
.trump{position:absolute;left:16px;top:70px;font-size:12px;font-weight:700;display:flex;gap:6px;align-items:center}
</style></head><body>
<div class="bar"><span class="menu">☰</span><div class="score"><div>Ние <b>0</b></div><div>Вие <b>0</b></div></div><span class="menu">⋯</span></div>
<div class="arc"></div>
<div class="seat" style="top:96px;left:50%;transform:translateX(-50%)"><span class="bub">Пас</span><div class="av">Б2</div><div class="nm">Бот 2</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side" style="top:330px;left:10px"><div class="av">Б3</div><div class="nm">Бот 3</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side turn" style="top:330px;right:10px"><span class="bub" style="right:0">Пас</span><div class="av">Б1</div><div class="nm">Бот 1</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="board"><h6><span>Наддаване</span><span>Ред 1</span></h6>
<div class="grid">
<div class="cell"><span class="box"></span>♣ Спатия</div><div class="cell"><span class="box"></span>Без коз</div>
<div class="cell"><span class="box"></span><span class="r">♦</span> Каро</div><div class="cell"><span class="box"></span>Всичко коз</div>
<div class="cell"><span class="box"></span><span class="r">♥</span> Купа</div><div class="cell off"><span class="box"></span>Контра</div>
<div class="cell on"><span class="box"></span>♠ Пика</div><div class="cell off"><span class="box"></span>Реконтра</div>
</div><div class="pass">Пас</div></div>
<div class="me"><div class="av">А</div>Ани</div>
<div class="hand"><div class="c">J<span>♣</span></div><div class="c r">J<span>♦</span></div><div class="c">K<span>♠</span></div><div class="c">A<span>♠</span></div><div class="c r">K<span>♥</span></div></div>
</body></html>
