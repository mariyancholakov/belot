<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600;700;800&family=Roboto+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--w:#fff;--k:#141414;--amb:#f2a900;--red:#d3222f;--line:#e5e5e5}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--w);font-family:Onest,sans-serif;color:var(--k);position:relative}
.board{position:absolute;top:10px;left:12px;right:12px;background:var(--k);border-radius:8px;padding:8px;display:flex;gap:10px;align-items:center;justify-content:center}
.f{display:flex;gap:2px}
.f i{font-style:normal;width:22px;height:32px;background:#2a2a2a;color:#fff;display:grid;place-items:center;font:700 20px 'Roboto Condensed',sans-serif;border-radius:3px;position:relative}
.f i::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.lbl{color:#aaa;font:600 11px 'Roboto Condensed';letter-spacing:.1em;text-transform:uppercase}
.seat{position:absolute;display:grid;justify-items:center;gap:4px}
.av{width:44px;height:44px;border-radius:50%;background:#f3f3f3;display:grid;place-items:center;font-weight:800}
.seat.turn .av{box-shadow:0 0 0 3px var(--amb)}
.nm{font-size:12px;font-weight:700}
.backs{display:flex}.backs i{width:22px;height:32px;border-radius:3px;background:var(--k);margin-left:-12px;border:1.5px solid #fff}.backs i:first-child{margin:0}
.side .backs{flex-direction:column}.side .backs i{margin:-22px 0 0;width:32px;height:22px}.side .backs i:first-child{margin:0}
.say{position:absolute;bottom:calc(100% + 6px);display:flex;gap:2px}
.say i{font-style:normal;width:16px;height:22px;background:var(--k);color:#fff;font:700 14px 'Roboto Condensed';display:grid;place-items:center;border-radius:2px}
.bid{position:absolute;left:50%;top:240px;transform:translateX(-50%);width:266px;display:grid;gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b{height:48px;background:var(--k);color:#fff;border-radius:5px;display:flex;align-items:center;justify-content:center;gap:6px;font:700 15px 'Roboto Condensed';text-transform:uppercase;letter-spacing:.04em;position:relative}
.b::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:#000}
.b.off{background:#ececec;color:#bbb}.b.off::after{background:#e0e0e0}
.r{color:#ff5a5a}
.pass{height:50px;background:var(--amb);color:var(--k);border-radius:5px;display:grid;place-items:center;font:700 18px 'Roboto Condensed';text-transform:uppercase}
.me{position:absolute;left:50%;bottom:182px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-weight:700}
.me .av{width:34px;height:34px;box-shadow:0 0 0 3px var(--amb)}
.hand{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex}
.c{width:80px;height:116px;background:#fff;border:1.5px solid var(--k);border-radius:8px;margin-left:-22px;padding:6px 8px;font-weight:800;font-size:22px;line-height:1}
.c:first-child{margin:0}.c span{display:block;font-size:18px}.c.rr{color:var(--red)}
</style></head><body>
<div class="board"><span class="lbl">Ние</span><div class="f"><i>0</i><i>0</i></div><span class="lbl" style="margin-left:14px">Вие</span><div class="f"><i>0</i><i>0</i></div></div>
<div class="seat" style="top:100px;left:50%;transform:translateX(-50%)"><span class="say"><i>П</i><i>А</i><i>С</i></span><div class="av">Б2</div><div class="nm">Бот 2</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side" style="top:340px;left:10px"><div class="av">Б3</div><div class="nm">Бот 3</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side turn" style="top:340px;right:10px"><div class="av">Б1</div><div class="nm">Бот 1</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="bid"><div class="grid">
<div class="b">♣ Спатия</div><div class="b">Без коз</div>
<div class="b"><span class="r">♦</span> Каро</div><div class="b">Всичко коз</div>
<div class="b"><span class="r">♥</span> Купа</div><div class="b off">Контра</div>
<div class="b">♠ Пика</div><div class="b off">Реконтра</div>
</div><div class="pass">Пас</div></div>
<div class="me"><div class="av">А</div>Ани</div>
<div class="hand"><div class="c">J<span>♣</span></div><div class="c rr">J<span>♦</span></div><div class="c">K<span>♠</span></div><div class="c">A<span>♠</span></div><div class="c rr">K<span>♥</span></div></div>
</body></html>
