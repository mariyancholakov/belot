<!doctype html>
<html lang="bg"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafafa;--k:#0a0a0a;--mut:#737373;--acc:#2f5bff;--red:#d3222f;--line:#e5e5e5}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;background:var(--bg);font-family:Onest,sans-serif;color:var(--k);position:relative}
.bar{position:absolute;top:0;left:0;right:0;height:56px;display:flex;justify-content:space-between;align-items:center;padding:0 16px}
.score{display:flex;gap:18px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--mut);font-weight:500}
.score b{color:var(--k);font-size:18px;margin-left:6px;font-weight:700}
.seat{position:absolute;display:grid;justify-items:center;gap:4px}
.av{width:44px;height:44px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px}
.seat.turn .av{border:2px solid var(--acc)}
.nm{font-size:12px;font-weight:600;color:#333}
.backs{display:flex;margin-top:-6px}.backs i{width:22px;height:32px;border-radius:4px;background:var(--k);border:1.5px solid #fff;margin-left:-12px}.backs i:first-child{margin:0}
.side .backs{flex-direction:column}.side .backs i{margin:-22px 0 0;width:32px;height:22px}.side .backs i:first-child{margin:0}
.bub{position:absolute;bottom:calc(100% + 8px);background:var(--k);color:#fff;border-radius:10px;padding:5px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.bid{position:absolute;left:50%;top:244px;transform:translateX(-50%);width:266px;display:grid;gap:6px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.b{height:46px;border:1px solid var(--line);background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center;gap:6px;font-weight:600;font-size:14px}
.b.off{color:#c4c4c4;background:transparent}
.r{color:var(--red)}
.pass{height:46px;border-radius:10px;background:var(--k);color:#fff;display:grid;place-items:center;font-weight:600}
.me{position:absolute;left:50%;bottom:182px;transform:translateX(-50%);display:flex;gap:8px;align-items:center;font-weight:600;font-size:14px}
.me .av{width:32px;height:32px;border:2px solid var(--acc)}
.hand{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);display:flex}
.c{width:80px;height:116px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-left:-22px;padding:7px 9px;font-weight:700;font-size:21px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.07)}
.c:first-child{margin:0}.c span{display:block;font-size:17px}
</style></head><body>
<div class="bar"><span>☰</span><div class="score"><span>Ние<b>0</b></span><span>Вие<b>0</b></span></div><span>⋯</span></div>
<div class="seat" style="top:96px;left:50%;transform:translateX(-50%)"><span class="bub">Пас</span><div class="av">Б2</div><div class="nm">Бот 2</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side" style="top:340px;left:10px"><div class="av">Б3</div><div class="nm">Бот 3</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="seat side turn" style="top:340px;right:10px"><div class="av">Б1</div><div class="nm">Бот 1</div><div class="backs"><i></i><i></i><i></i><i></i><i></i></div></div>
<div class="bid"><div class="grid">
<div class="b">♣ Спатия</div><div class="b">Без коз</div>
<div class="b"><span class="r">♦</span> Каро</div><div class="b">Всичко коз</div>
<div class="b"><span class="r">♥</span> Купа</div><div class="b off">Контра</div>
<div class="b">♠ Пика</div><div class="b off">Реконтра</div>
</div><div class="pass">Пас</div></div>
<div class="me"><div class="av">А</div>Ани</div>
<div class="hand"><div class="c">J<span>♣</span></div><div class="c r">J<span>♦</span></div><div class="c">K<span>♠</span></div><div class="c">A<span>♠</span></div><div class="c r">K<span>♥</span></div></div>
</body></html>
